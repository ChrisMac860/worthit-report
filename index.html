    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Courier New", monospace;

  /* ---------- scanline / phosphor overlay ---------- */
  .scan-overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    background-image:repeating-linear-gradient(

  /* ---------- dither tile (replaces gradients) ---------- */
  .dither{
    background-image:repeating-conic-gradient(var(--phosphor) 0% 25%, transparent 0% 50%);

    background-color:var(--bg);

  /* ---------- bevelled chrome ---------- */
  .bevel{
    border:2px solid var(--line);

  .sticker-preview{
    display:block;
    width:120px;

    border:2px solid var(--line);
    background-image:repeating-conic-gradient(#111 0% 25%, #000 0% 50%);

  /* ---------- buttons (bevelled pixel) ---------- */
  .btn-pixel{
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:44px;
    padding:10px 14px;
    background:#0a0a08;

    box-shadow:
      inset -2px -2px 0 rgba(255,176,30,0.45),

  /* ---------- score screen layout ---------- */
  .score-block{
    padding:10px 12px;

  /* ---------- hero (oversized, off-centre) ---------- */

  canvas#hrChart{
    width:100%;
    height:auto;
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;

  table{
    width:100%;
    border-collapse:collapse;

<body>

<div class="scan-overlay" aria-hidden="true"></div>

<div class="header">
  <canvas id="mugIcon" width="24" height="24"></canvas>
  <h1>Worth it?</h1>

</div>

  <button id="stickerBtn" class="btn-pixel" type="button" hidden>Sticker for Instagram</button>

</div>
<img id="stickerPreview" class="sticker-preview" alt="Generated Instagram sticker preview" hidden>

<div id="selftest" hidden></div>
<div id="app"></div>

<footer>
  <div class="footer-line">Association, not cause. Heart rate rises for many reasons.</div>
  <div class="credits-row">
    <span class="credits-label">INSERT COIN</span>
    <a class="btn-pixel" href="https://buymeacoffee.com/christopheosp" target="_blank" rel="noopener noreferrer">
      <span class="mugpx" aria-hidden="true"></span> Buy me a beer
    </a>
  </div>
</footer>

<script>
/*
DEMO SAMPLE PAYLOAD (also used by ?demo mode):
v1~1725400000.1725407800~1725400000.1725402500.1725404200.1725406000~300.62.300.68.300.71.300.75.300.79.300.83.300.90.300.95.300.88.300.85~62.79.95~-.-~0~1725313600.1725320800.3.71.88.1|1725227200.1725232400.2.66.80.-

WIRE FORMAT
v1~<sa>.<en>~<b1>.<b2>...~<dt>.<bpm>.<dt>.<bpm>...~<hs>.<ha>.<hp>~<ts>.<te>~<pr>~<prev>|<prev>...
Sections separated by ~, in order: version, times, beers, hrTrace, hrStats, temp, prediction, previous.
- times: sa=session start epoch sec, en=end epoch (may be "-" -> auto-closed, use last beer as end)
- beers: absolute epoch seconds, ascending; first beer == sa
- hrTrace: flat alternating dt,bpm; dt = seconds since PREVIOUS point (first dt = since sa); may be empty
- hrStats: start.avg.peak bpm; any may be "-"
- temp: start.end tenths of C; "-" when no sensor; hide section when both "-"
- prediction: 0 = "I'll be grand", 1 = "Absolutely not", "-" = not asked
- previous: |-separated "sa.en.beers.ha.hp.pr", newest first, up to 5; may be empty
- any field "-" means null. Malformed input -> friendly error, never blank/JS error.
*/

var DEMO_PAYLOAD = "v1~1725400000.1725407800~1725400000.1725402500.1725404200.1725406000~300.62.300.68.300.71.300.75.300.79.300.83.300.90.300.95.300.88.300.85~62.79.95~-.-~0~1725313600.1725320800.3.71.88.1|1725227200.1725232400.2.66.80.-";

// ---------- helpers ----------
function num(s){
  if (s === undefined || s === null || s === "-" || s === "") return null;
  var n = Number(s);
  return isFinite(n) ? n : null;
}
function isPosInt(n){ return n !== null && isFinite(n) && n >= 0; }

function pad2(n){ return (n < 10 ? "0" : "") + n; }

function fmtClock(epochSec){
  if (epochSec === null) return "—";
  var d = new Date(epochSec * 1000);
  if (isNaN(d.getTime())) return "—";
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function fmtDate(epochSec){
  if (epochSec === null) return "—";
  var d = new Date(epochSec * 1000);
  if (isNaN(d.getTime())) return "—";
  var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getDay()] + " " + d.getDate() + " " + mons[d.getMonth()] + " " + d.getFullYear();
}
function fmtDur(sec){
  if (sec === null || sec < 0) return "—";
  var h = Math.floor(sec / 3600);
  var m = Math.floor((sec % 3600) / 60);
  if (h <= 0) return m + "m";
  return h + "h " + m + "m";
}
function fmtHMM(sec){
  // hours:minutes from a duration in seconds, for chart x-axis
  var h = Math.floor(sec / 3600);
  var m = Math.floor((sec % 3600) / 60);
  return h + ":" + pad2(m);
}

// ---------- parser ----------
// returns { ok:true, data:{...} } or { ok:false, error:"..." }
function parseFragment(raw){
  try {
    if (typeof raw !== "string" || raw.length === 0) {
      return { ok:false, error:"Empty report" };
    }
    var parts = raw.split("~");
    if (parts.length < 7) return { ok:false, error:"Malformed report (missing sections)" };
    var version = parts[0];
    if (version !== "v1") return { ok:false, error:"Unsupported report version" };

    var timesRaw = parts[1] || "";
    var beersRaw = parts[2] || "";
    var traceRaw = parts[3] || "";
    var hrStatsRaw = parts[4] || "";
    var tempRaw = parts[5] || "";
    var predRaw = parts[6] !== undefined ? parts[6] : "-";
    var prevRaw = parts[7] !== undefined ? parts[7] : "";

    // times
    var timesParts = timesRaw.split(".");
    var sa = num(timesParts[0]);
    var en = num(timesParts[1]);
    if (!isPosInt(sa)) return { ok:false, error:"Malformed report (bad start time)" };

    // beers
    var beers = [];
    if (beersRaw.length > 0) {
      var bparts = beersRaw.split(".");
      for (var i = 0; i < bparts.length; i++) {
        var b = num(bparts[i]);
        if (b !== null) beers.push(b);
      }
    }
    // fallback end: last beer if en missing
    if (en === null) {
      if (beers.length > 0) en = beers[beers.length - 1];
      else en = sa;
    }

    // hr trace: dt,bpm pairs -> absolute epoch points
    var trace = [];
    if (traceRaw.length > 0) {
      var tparts = traceRaw.split(".");
      var cursor = sa;
      for (var j = 0; j + 1 < tparts.length; j += 2) {
        var dt = num(tparts[j]);
        var bpm = num(tparts[j+1]);
        if (dt === null || bpm === null) continue;
        cursor = cursor + dt;
        trace.push({ t: cursor, bpm: bpm });
      }
    }

    // hr stats
    var hsParts = hrStatsRaw.split(".");
    var hs = num(hsParts[0]);
    var ha = num(hsParts[1]);
    var hp = num(hsParts[2]);

    // temp
    var tParts = tempRaw.split(".");
    var ts = num(tParts[0]);
    var te = num(tParts[1]);

    // prediction
    var pr = (predRaw === "0" || predRaw === "1") ? predRaw : null;

    // previous sessions
    var previous = [];
    if (prevRaw && prevRaw.length > 0) {
      var pItems = prevRaw.split("|");
      for (var k = 0; k < pItems.length; k++) {
        var pi = pItems[k];
        if (!pi) continue;
        var pp = pi.split(".");
        var psa = num(pp[0]);
        var pen = num(pp[1]);
        var pbeers = num(pp[2]);
        var pha = num(pp[3]);
        var php = num(pp[4]);
        var ppr = (pp[5] === "0" || pp[5] === "1") ? pp[5] : null;
        if (psa === null) continue;
        previous.push({ sa: psa, en: pen, beers: pbeers, ha: pha, hp: php, pr: ppr });
      }
    }

    return {
      ok: true,
      data: {
        sa: sa, en: en,
        beers: beers,
        trace: trace,
        hs: hs, ha: ha, hp: hp,
        ts: ts, te: te,
        pr: pr,
        previous: previous
      }
    };
  } catch (e) {
    return { ok:false, error:"Couldn't read this report" };
  }
}

// ---------- rendering ----------
function drawMugIcon(canvas){
  var ctx = canvas.getContext("2d");
  var s = 3; // pixel scale
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,24,24);
  ctx.fillStyle = "#FFB01E";
  // simple pixel mug: body + handle + foam
  var body = [
    [1,2],[2,2],[3,2],[4,2],
    [1,3],[4,3],
    [1,4],[4,4],
    [1,5],[4,5],
    [1,6],[2,6],[3,6],[4,6]
  ];
  for (var i=0;i<body.length;i++){
    ctx.fillRect(body[i][0]*s, body[i][1]*s, s, s);
  }
  // handle
  ctx.fillRect(5*s, 3*s, s, s);
  ctx.fillRect(5*s, 4*s, s, s);
  ctx.fillRect(5*s, 5*s, s, s);
  // foam
  ctx.fillStyle = "#F2EFE6";
  ctx.fillRect(1*s, 1*s, s, s);
  ctx.fillRect(2*s, 1*s, s, s);
  ctx.fillRect(3*s, 1*s, s, s);
  ctx.fillRect(4*s, 1*s, s, s);
}

function nearestHrAt(trace, tSec, windowSec){
  if (!trace || trace.length === 0) return null;
  var best = null, bestDiff = Infinity;
  for (var i=0;i<trace.length;i++){
    var diff = Math.abs(trace[i].t - tSec);
    if (diff < bestDiff) { bestDiff = diff; best = trace[i]; }
  }
  if (best && bestDiff <= windowSec) return best.bpm;
  return null;
}

// Pixel-faithful HR chart: drawn at a small internal resolution (deliberately
// NOT multiplied by devicePixelRatio -- pixel art is upscaled with nearest-
// neighbour via image-rendering:pixelated, so extra source pixels would only
// soften the blocky look) and stretched to the full CSS width.
function drawChart(canvas, data){
  var cssWidth = canvas.clientWidth || 300;
  var PXU = 3; // one internal "pixel" = 3 CSS px on screen
  var Wcss = Math.max(280, cssWidth);
  var Hcss = 160;
  var W = Math.max(90, Math.round(Wcss / PXU));
  var H = Math.round(Hcss / PXU);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = "100%";
  canvas.style.height = Hcss + "px";
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,W,H);

  var padL = 11, padR = 3, padT = 4, padB = 7;
  var plotW = W - padL - padR;
  var plotH = H - padT - padB;

  var sa = data.sa, en = data.en;
  var span = Math.max(1, en - sa);

  var trace = data.trace;
  var hasTrace = trace && trace.length > 0;

  var minBpm = 40, maxBpm = 160;
  if (hasTrace) {
    var vals = trace.map(function(p){return p.bpm;});
    minBpm = Math.min.apply(null, vals);
    maxBpm = Math.max.apply(null, vals);
  }
  if (data.hp !== null) maxBpm = Math.max(maxBpm, data.hp);
  if (data.hs !== null) minBpm = Math.min(minBpm, data.hs);
  minBpm = Math.floor((minBpm - 5) / 10) * 10;
  maxBpm = Math.ceil((maxBpm + 5) / 10) * 10;
  if (maxBpm - minBpm < 20) maxBpm = minBpm + 20;

  function xFor(t){ return padL + Math.round(((t - sa) / span) * plotW); }
  function yFor(bpm){ return padT + Math.round((1 - (bpm - minBpm) / (maxBpm - minBpm)) * plotH); }

  ctx.fillStyle = "#333333";
  var gridCount = 4;
  for (var g=0; g<=gridCount; g++){
    var bpmVal = minBpm + (g/gridCount)*(maxBpm-minBpm);
    var y = yFor(bpmVal);
    ctx.fillRect(padL, y, plotW, 1);
  }
  ctx.fillStyle = "#8a8a80";
  ctx.font = "6px ui-monospace, monospace";
  ctx.textBaseline = "middle";
  for (var g2=0; g2<=gridCount; g2++){
    var bpmVal2 = minBpm + (g2/gridCount)*(maxBpm-minBpm);
    ctx.fillText(Math.round(bpmVal2), 0, yFor(bpmVal2));
  }
  ctx.textBaseline = "alphabetic";
  var xTicks = 3;
  for (var xt=0; xt<=xTicks; xt++){
    var tVal = (xt/xTicks) * span;
    var xPix = xFor(sa + tVal);
    ctx.fillText(fmtHMM(tVal), Math.max(padL, Math.min(xPix - 6, W - padR - 16)), H - 1);
  }

  // beer markers: dashed pixel line + tiny mug glyph
  if (data.beers && data.beers.length > 0) {
    for (var bi=0; bi<data.beers.length; bi++){
      var bx = xFor(data.beers[bi]);
      ctx.fillStyle = "#FFB01E";
      for (var yy = padT; yy < padT + plotH; yy += 2){
        ctx.fillRect(bx, yy, 1, 1);
      }
      // tiny mug: 2x2 body + 1px handle
      ctx.fillRect(bx-1, padT-3, 2, 2);
      ctx.fillRect(bx+1, padT-2, 1, 1);
    }
  }

  // hr trace: stepped, square-snapped line
  if (hasTrace) {
    ctx.fillStyle = "#F2EFE6";
    var prevX = null, prevY = null;
    for (var i=0;i<trace.length;i++){
      var px = xFor(trace[i].t);
      var py = yFor(trace[i].bpm);
      if (prevX !== null) {
        // step: horizontal at prevY to px, then vertical to py
        var x0 = Math.min(prevX, px), x1 = Math.max(prevX, px);
        ctx.fillRect(x0, prevY, Math.max(1, x1-x0), 1);
        var y0 = Math.min(prevY, py), y1 = Math.max(prevY, py);
        ctx.fillRect(px, y0, 1, Math.max(1, y1-y0));
      }
      ctx.fillRect(px, py, 1, 1);
      prevX = px; prevY = py;
    }

    if (data.hp !== null) {
      var peakPt = null;
      for (var pi=0; pi<trace.length; pi++){
        if (trace[pi].bpm === data.hp) { peakPt = trace[pi]; break; }
      }
      if (peakPt) {
        var ppx = xFor(peakPt.t), ppy = yFor(peakPt.bpm);
        ctx.fillStyle = "#FFB01E";
        ctx.fillRect(ppx-1, ppy-1, 3, 3);
      }
    }
  }

  ctx.fillStyle = "#555555";
  ctx.fillRect(padL, padT, plotW, 1);
  ctx.fillRect(padL, padT+plotH-1, plotW, 1);
  ctx.fillRect(padL, padT, 1, plotH);
  ctx.fillRect(padL+plotW-1, padT, 1, plotH);
}

function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function scoreRow(label, value, amber){
  var row = el("div", "score-row" + (amber ? " amber" : ""));
  row.appendChild(el("div","k",label));
  row.appendChild(el("div","v tabular",value));
  return row;
}

function renderReport(container, data){
  container.innerHTML = "";

  document.getElementById("sessionDate").textContent = fmtDate(data.sa);

  var duration = (data.en !== null && data.sa !== null) ? Math.max(0, data.en - data.sa) : null;
  var beerCount = data.beers ? data.beers.length : 0;

  var board = el("div","board");

  // ---- wide column ----
  var colWide = el("div","col-wide");

  // hero: oversized, off-centre beer count
  var hero = el("div","hero bevel-amber");
  hero.appendChild(el("div","label","This session"));
  hero.appendChild(el("div","val pixel-face tabular", String(beerCount)));
  var sub = el("div","sub");
  var d1 = el("div","");
  d1.appendChild(el("span","k","Dur ")); d1.appendChild(el("span","v2 tabular",fmtDur(duration)));
  var d2 = el("div","");
  d2.appendChild(el("span","k","Start–End ")); d2.appendChild(el("span","v2 tabular", fmtClock(data.sa) + "–" + fmtClock(data.en)));
  sub.appendChild(d1); sub.appendChild(d2);
  hero.appendChild(sub);
  colWide.appendChild(hero);

  // HR chart section
  var hrSec = el("section","score-block bevel");
  hrSec.appendChild(el("h2","", "Heart Rate"));
  var canvas = document.createElement("canvas");
  canvas.id = "hrChart";
  hrSec.appendChild(canvas);
  hrSec.appendChild(scoreRow("Start", data.hs === null ? "—" : Math.round(data.hs) + " bpm"));
  hrSec.appendChild(scoreRow("Average", data.ha === null ? "—" : Math.round(data.ha) + " bpm"));
  hrSec.appendChild(scoreRow("Peak", data.hp === null ? "—" : Math.round(data.hp) + " bpm", true));
  if ((!data.trace || data.trace.length === 0) && data.hs === null && data.ha === null && data.hp === null) {
    hrSec.appendChild(el("div","empty","No HR data for this session."));
  }
  colWide.appendChild(hrSec);

  requestAnimationFrame(function(){
    try { drawChart(canvas, data); } catch(e) {}
  });

  // Beers table
  var beersSec = el("section","score-block bevel");
  beersSec.appendChild(el("h2","", "Beers"));
  if (!data.beers || data.beers.length === 0) {
    beersSec.appendChild(el("div","empty","No beers logged."));
  } else {
    var wrap = el("div","overflow-x");
    var table = document.createElement("table");
    var thead = el("tr","", "<th>#</th><th>Time</th><th>Gap</th><th>HR</th>");
    table.appendChild(thead);
    var gaps = [];
    for (var i=0;i<data.beers.length;i++){
      var t = data.beers[i];
      var gapMin = i === 0 ? null : Math.round((t - data.beers[i-1]) / 60);
      if (gapMin !== null) gaps.push(gapMin);
      var hrAt = nearestHrAt(data.trace, t, 120);
      var tr = document.createElement("tr");
      tr.innerHTML = "<td class='beer-num'>" + (i+1) + "</td>" +
        "<td>" + fmtClock(t) + "</td>" +
        "<td>" + (gapMin === null ? "—" : gapMin + "m") + "</td>" +
        "<td>" + (hrAt === null ? "—" : Math.round(hrAt) + " bpm") + "</td>";
      table.appendChild(tr);
    }
    wrap.appendChild(table);
    beersSec.appendChild(wrap);
    if (gaps.length > 0) {
      var avgGap = Math.round(gaps.reduce(function(a,b){return a+b;},0) / gaps.length);
      beersSec.appendChild(el("div","avg-gap","Average gap: <b>" + avgGap + "m</b>"));
    }
  }
  colWide.appendChild(beersSec);

  board.appendChild(colWide);

  // ---- narrow column ----
  var colNarrow = el("div","col-narrow");

  // Famous last words
  var flwSec = el("section","score-block bevel");
  flwSec.appendChild(el("h2","", "Famous Last Words"));
  var verdictText, verdictCls;
  if (data.pr === "0") { verdictText = "“I'll be grand”"; verdictCls = "verdict"; }
  else if (data.pr === "1") { verdictText = "“Absolutely not”"; verdictCls = "verdict"; }
  else { verdictText = "Not asked"; verdictCls = "verdict none"; }
  flwSec.appendChild(el("div", verdictCls, verdictText));
  colNarrow.appendChild(flwSec);

  // Temperature (only if present)
  if (data.ts !== null || data.te !== null) {
    var tempSec = el("section","score-block bevel");
    tempSec.appendChild(el("h2","", "Temperature (supporting data)"));
    var tsC = data.ts !== null ? (data.ts/10).toFixed(1) + "°C" : "—";
    var teC = data.te !== null ? (data.te/10).toFixed(1) + "°C" : "—";
    var deltaC = (data.ts !== null && data.te !== null) ? (((data.te - data.ts)/10 >= 0 ? "+" : "") + ((data.te - data.ts)/10).toFixed(1) + "°C") : "—";
    tempSec.appendChild(scoreRow("Start", tsC));
    tempSec.appendChild(scoreRow("End", teC));
    tempSec.appendChild(scoreRow("Change", deltaC));
    colNarrow.appendChild(tempSec);
  }

  // Previous sessions
  var prevSec = el("section","score-block bevel");
  prevSec.appendChild(el("h2","", "Previous Sessions"));
  if (!data.previous || data.previous.length === 0) {
    prevSec.appendChild(el("div","empty","First recorded session."));
  } else {
    var pwrap = el("div","overflow-x");
    var ptable = document.createElement("table");
    var pthead = el("tr","", "<th>Date</th><th>Beers</th><th>Dur</th><th>Avg HR</th><th>Peak</th><th>FLW</th>");
    ptable.appendChild(pthead);

    var curDur = (data.en !== null && data.sa !== null) ? fmtDur(Math.max(0, data.en - data.sa)) : "—";
    var curTr = document.createElement("tr");
    curTr.className = "current";
    curTr.innerHTML = "<td>" + fmtDate(data.sa) + " (now)</td>" +
      "<td>" + beerCount + "</td>" +
      "<td>" + curDur + "</td>" +
      "<td>" + (data.ha !== null ? Math.round(data.ha) : "—") + "</td>" +
      "<td>" + (data.hp !== null ? Math.round(data.hp) : "—") + "</td>" +
      "<td>" + (data.pr === "0" ? "Grand" : data.pr === "1" ? "Not" : "—") + "</td>";
    ptable.appendChild(curTr);

    for (var pj=0; pj<data.previous.length; pj++){
      var ps = data.previous[pj];
      if (ps.sa === data.sa) { continue; }
      var pDur = (ps.en !== null && ps.sa !== null) ? fmtDur(Math.max(0, ps.en - ps.sa)) : "—";
      var ptr = document.createElement("tr");
      ptr.innerHTML = "<td>" + fmtDate(ps.sa) + "</td>" +
        "<td>" + (ps.beers === null ? "—" : ps.beers) + "</td>" +
        "<td>" + pDur + "</td>" +
        "<td>" + (ps.ha !== null ? Math.round(ps.ha) : "—") + "</td>" +
        "<td>" + (ps.hp !== null ? Math.round(ps.hp) : "—") + "</td>" +
        "<td>" + (ps.pr === "0" ? "Grand" : ps.pr === "1" ? "Not" : "—") + "</td>";
      ptable.appendChild(ptr);
    }
    pwrap.appendChild(ptable);
    prevSec.appendChild(pwrap);
  }
  colNarrow.appendChild(prevSec);

  board.appendChild(colNarrow);
  container.appendChild(board);
}

function renderError(container, message){
  container.innerHTML = "";
  var box = el("div","err-box bevel");
  box.appendChild(el("h2","", "Couldn't read this report"));
  box.appendChild(el("p","", message || "The link may be incomplete or corrupted."));
  container.appendChild(box);
}

// ---------- Instagram sticker ----------
// Offscreen 1080x1080 transparent PNG, drawn on a 108x108 design grid scaled x10.
// Facts only: counts, times, HR numbers. No praise, no shame, no causal claim.
function renderSticker(data){
  var SIZE = 1080, GRID = 108, S = SIZE / GRID;
  var c = document.createElement("canvas");
  c.width = SIZE; c.height = SIZE;
  var ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  // transparent background: no fillRect over the full canvas

  function px(x, y, w, h, color){
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x*S), Math.round(y*S), Math.round(w*S), Math.round(h*S));
  }
  function text(str, x, y, size, color, font){
    ctx.fillStyle = color;
    ctx.font = size + "px " + (font || "'Press Start 2P', monospace");
    ctx.textBaseline = "top";
    ctx.fillText(str, Math.round(x*S), Math.round(y*S));
  }

  var AMBER = "#FFB01E", FG = "#F2EFE6", DIM = "#b9b6ab";

  // frame
  px(4,4,100,100,"rgba(0,0,0,0.001)"); // no-op keeps transparent bg untouched
  ctx.strokeStyle = AMBER;
  ctx.lineWidth = S*2;
  ctx.strokeRect(4*S, 4*S, 100*S, 100*S);

  // wordmark
  text("WORTH IT?", 10, 12, 7, FG);

  // pixel mug, top-right
  var mugX = 88, mugY = 10;
  var body = [[0,1],[1,1],[2,1],[3,1],[0,2],[3,2],[0,3],[3,3],[0,4],[1,4],[2,4],[3,4]];
  for (var i=0;i<body.length;i++){ px(mugX+body[i][0], mugY+body[i][1], 1, 1, AMBER); }
  px(mugX,mugY,1,1,FG); px(mugX+1,mugY,1,1,FG); px(mugX+2,mugY,1,1,FG); px(mugX+3,mugY,1,1,FG);
  px(mugX+4, mugY+1.5, 1, 2, AMBER);

  // hero beer count
  var beerCount = data.beers ? data.beers.length : 0;
  text("BEERS", 10, 26, 4, DIM);
  text(String(beerCount), 9, 32, 26, AMBER);

  // duration / date
  var duration = (data.en !== null && data.sa !== null) ? Math.max(0, data.en - data.sa) : null;
  text(fmtDate(data.sa), 10, 64, 4, FG, "ui-monospace, monospace");
  text("DUR " + fmtDur(duration), 10, 71, 4, DIM, "ui-monospace, monospace");

  // HR stats, skip nulls
  var hrLine = [];
  if (data.hs !== null) hrLine.push("START " + Math.round(data.hs));
  if (data.ha !== null) hrLine.push("AVG " + Math.round(data.ha));
  if (data.hp !== null) hrLine.push("PEAK " + Math.round(data.hp));
  if (hrLine.length > 0){
    text(hrLine.join("   ") + " BPM", 10, 79, 4, FG, "ui-monospace, monospace");
  }

  // small stepped HR trace
  if (data.trace && data.trace.length > 1) {
    var sa = data.sa, en = data.en, span = Math.max(1, en - sa);
    var vals = data.trace.map(function(p){return p.bpm;});
    var minB = Math.min.apply(null, vals), maxB = Math.max.apply(null, vals);
    if (maxB - minB < 10) { maxB = minB + 10; }
    var tx0 = 10, tx1 = 98, ty0 = 96, ty1 = 86;
    var prevX=null, prevY=null;
    for (var ti=0; ti<data.trace.length; ti++){
      var tp = data.trace[ti];
      var x = tx0 + ((tp.t - sa)/span) * (tx1 - tx0);
      var y = ty0 + (1 - (tp.bpm - minB)/(maxB - minB)) * (ty1 - ty0);
      x = Math.round(x); y = Math.round(y);
      if (prevX !== null){
        px(Math.min(prevX,x), prevY, Math.max(1, Math.abs(x-prevX)), 0.6, FG);
        px(x, Math.min(prevY,y), 0.6, Math.max(1, Math.abs(y-prevY)), FG);
      }
      prevX = x; prevY = y;
    }
  }

  // famous last words, if set
  if (data.pr === "0" || data.pr === "1"){
    var flw = data.pr === "0" ? "“I'LL BE GRAND”" : "“ABSOLUTELY NOT”";
    text(flw, 10, 100, 3.4, AMBER, "ui-monospace, monospace");
  }

  return c;
}

async function handleStickerShare(data, btn, statusEl, previewImg){
  btn.disabled = true;
  statusEl.hidden = false;
  statusEl.textContent = "Generating sticker…";
  try{
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
    var canvas = renderSticker(data);
    canvas.toBlob(async function(blob){
      try{
        if (!blob) { statusEl.textContent = "Couldn't generate the sticker. Try again."; btn.disabled = false; return; }
        var dateSlug = fmtDate(data.sa).replace(/[^a-z0-9]+/gi,'-').toLowerCase().replace(/^-+|-+$/g,'') || "session";
        var fname = "worth-it-" + dateSlug + ".png";
        var url = URL.createObjectURL(blob);
        previewImg.src = url;
        previewImg.hidden = false;

        var file;
        try { file = new File([blob], fname, {type:"image/png"}); } catch(e) { file = null; }

        if (file && navigator.canShare && navigator.canShare({files:[file]})) {
          try {
            await navigator.share({files:[file], title:"Worth it?"});
            statusEl.textContent = "";
            btn.disabled = false;
            return;
          } catch(shareErr){ /* user cancelled or unsupported -> fall through to download */ }
        }

        var a = document.createElement("a");
        a.href = url;
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        statusEl.innerHTML = "Saved to your photos.<br>Instagram → your story → sticker tray → add from photos.";
        btn.disabled = false;
      } catch(innerErr){
        statusEl.textContent = "Couldn't generate the sticker. Try again.";
        btn.disabled = false;
      }
    }, "image/png");
  } catch(e){
    statusEl.textContent = "Couldn't generate the sticker. Try again.";
    btn.disabled = false;
  }
}

// ---------- self test ----------
function runSelfTest(container){
  var fixtures = [
    {
      name: "full",
      input: DEMO_PAYLOAD,
      expect: function(r){ return r.ok && r.data.beers.length === 4 && r.data.trace.length === 10 && r.data.pr === "0" && r.data.previous.length === 2; }
    },
    {
      name: "minimal (all dashes)",
      input: "v1~1725400000.-~-~~-.-.-~-.-~-~",
      expect: function(r){ return r.ok && r.data.beers.length === 0 && r.data.trace.length === 0 && r.data.hs===null && r.data.pr===null && r.data.previous.length===0 && r.data.en === r.data.sa; }
    },
    {
      name: "malformed",
      input: "garbage-not-a-payload",
      expect: function(r){ return r.ok === false; }
    }
  ];

  var lines = [];
  var allPass = true;
  for (var i=0;i<fixtures.length;i++){
    var f = fixtures[i];
    var result;
    try { result = parseFragment(f.input); }
    catch(e) { result = { ok:false, error:"threw: " + e.message }; }
    var pass;
    try { pass = !!f.expect(result); } catch(e){ pass = false; }
    if (!pass) allPass = false;
    lines.push((pass ? "PASS" : "FAIL") + " — " + f.name);
  }
  lines.push("");
  lines.push(allPass ? "ALL TESTS PASSED" : "SOME TESTS FAILED");
  container.textContent = lines.join("\n");
  container.hidden = false;
}

// ---------- boot ----------
(function boot(){
  var mugCanvas = document.getElementById("mugIcon");
  drawMugIcon(mugCanvas);

  var qs = window.location.search || "";
  var hash = window.location.hash || "";
  var fragment = hash.length > 1 ? decodeURIComponent(hash.substring(1)) : "";

  if (qs.indexOf("selftest") !== -1) {
    runSelfTest(document.getElementById("selftest"));
  }

  var appEl = document.getElementById("app");

  if (fragment.length === 0 && qs.indexOf("demo") !== -1) {
    fragment = DEMO_PAYLOAD;
  }

  if (fragment.length === 0) {
    if (qs.indexOf("selftest") === -1) {
      renderError(appEl, "No report data found in the link. Open this page via “Send to Phone” on the watch.");
    }
    return;
  }

  var parsed = parseFragment(fragment);
  if (!parsed.ok) {
    renderError(appEl, parsed.error);
    return;
  }
  try {
    renderReport(appEl, parsed.data);
    var stickerBtn = document.getElementById("stickerBtn");
    var stickerStatus = document.getElementById("stickerStatus");
    var stickerPreview = document.getElementById("stickerPreview");
    stickerBtn.hidden = false;
    stickerBtn.addEventListener("click", function(){
      handleStickerShare(parsed.data, stickerBtn, stickerStatus, stickerPreview);
    });
  } catch (e) {
    renderError(appEl, "Something went wrong displaying this report.");
  }
})();

window.addEventListener("resize", function(){
  var c = document.getElementById("hrChart");
  if (!c) return;
  var hash = window.location.hash || "";
  var qs = window.location.search || "";
  var fragment = hash.length > 1 ? decodeURIComponent(hash.substring(1)) : (qs.indexOf("demo")!==-1 ? DEMO_PAYLOAD : "");
  if (!fragment) return;
  var parsed = parseFragment(fragment);
  if (parsed.ok) {
    try { drawChart(c, parsed.data); } catch(e) {}
  }
});
